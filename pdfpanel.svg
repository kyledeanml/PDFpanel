<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#131c31"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer rounded panel tile -->
  <rect x="14" y="14" width="228" height="228" rx="44" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>
  <rect x="20" y="20" width="216" height="216" rx="38" fill="none" stroke="url(#neonCyan)" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Back stacked PDF sheet (Merge/Split motif) -->
  <path d="M84 44 L170 44 L196 70 L196 184 C196 192 190 198 182 198 L84 198 C76 198 70 192 70 184 L70 58 C70 50 76 44 84 44 Z"
        fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="3"/>

  <!-- Front primary PDF sheet -->
  <path d="M62 60 L148 60 L176 88 L176 202 C176 210 170 216 162 216 L62 216 C54 216 48 210 48 202 L48 74 C48 66 54 60 62 60 Z"
        fill="#0b1220" stroke="url(#neonCyan)" stroke-width="4" filter="url(#glow)"/>

  <!-- Folded corner -->
  <path d="M148 60 L148 88 L176 88 Z" fill="#162238" stroke="url(#neonCyan)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Bookmark ribbon -->
  <path d="M126 60 L142 60 L142 114 L134 106 L126 114 Z" fill="url(#ribbonGrad)" filter="url(#glow)"/>

  <!-- Document lines & split dashed cut line -->
  <line x1="68" y1="100" x2="116" y2="100" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
  <line x1="68" y1="118" x2="152" y2="118" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Neon split cut line with chevron arrows -->
  <line x1="40" y1="144" x2="188" y2="144" stroke="#00f0ff" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round" filter="url(#glow)"/>

  <!-- PDF badge on lower half -->
  <rect x="66" y="162" width="92" height="34" rx="8" fill="#082f49" stroke="#00d4ff" stroke-width="2.5"/>
  <text x="112" y="185" text-anchor="middle" font-family="Sans, DejaVu Sans, Arial" font-weight="bold" font-size="20" fill="#ffffff" letter-spacing="2">PDF</text>
</svg>
